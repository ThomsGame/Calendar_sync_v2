[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-sync"
version = "0.1.0"
description = "Synchronisation Snexi & Constatimmo vers Google Calendar"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.108.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    # Dashboard
    "flask>=3.0.0",
    "flask-login>=0.6.3",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
calendar-sync = "calendar_sync.main:main"
calendar-dashboard = "dashboard:create_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
