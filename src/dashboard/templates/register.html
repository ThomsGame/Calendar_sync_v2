{% extends "base.html" %}
{% block title %}Créer un compte{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">&#128197; Calendar Sync</h1>
    <p class="auth-subtitle">Créez votre espace de synchronisation</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus
               placeholder="votre@email.com" />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required
               placeholder="Minimum 8 caractères" minlength="8" />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirmer le mot de passe</label>
        <input type="password" id="confirm_password" name="confirm_password" required
               placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-full">Créer mon compte</button>
    </form>

    <p class="auth-footer">
      Déjà un compte ?
      <a href="{{ url_for('auth.login') }}">Se connecter</a>
    </p>
  </div>
</div>
{% endblock %}
